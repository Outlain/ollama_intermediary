# This is the operator-owned base configuration. The /settings page never
# rewrites this file; it stores validated overrides in /app/state/settings.json.
# Secrets remain in secrets.env and cannot be read or changed in the browser.
server:
  listen: 0.0.0.0:11434
  body_limit_bytes: 67108864
  # Keep this below Compose stop_grace_period so final cleanup can complete.
  shutdown_grace: 2m
  # Enable only behind a trusted reverse proxy; this permits X-Forwarded-For classification.
  trusted_proxy: false
  status_path: /status
  metrics_path: /metrics
  # Useful when a client cannot set X-Ollama-Client and source-IP classification is unsuitable.
  # Add matching port mappings to docker-compose.yml when these are enabled.
  dedicated_listeners: []
  # dedicated_listeners:
  #   - listen: 0.0.0.0:11435
  #     client: odysseus
  #   - listen: 0.0.0.0:11436
  #     client: frigate

ollama:
  # Supplied by secrets.env; never point this at the proxy itself.
  url: "${OLLAMA_URL:?Set OLLAMA_URL in secrets.env}"
  health_interval: 5s
  health_timeout: 3s
  # Hard runtime after dispatch; time spent in the proxy queue does not consume this budget.
  request_timeout: 30m

clients:
  default:
    priority: 50
    queue_limit: 20
    request_ttl: 10m
    max_wait: 5m
    overflow_policy: reject
    source_ips: []
    model_policy:
      idle_hold: 0s
      max_batch_requests: 1
      max_batch_time: 60s
      keep_alive: null

  odysseus:
    priority: 100
    queue_limit: 10
    request_ttl: 30m
    # Interactive work may force a model switch immediately once the GPU is free.
    max_wait: 0s
    overflow_policy: reject
    # This is the fallback client, so Odysseus needs no stable Docker IP.
    source_ips: []
    # Applies to every model Odysseus requests; no model registration is required.
    model_policy:
      group: odysseus
      idle_hold: 1m
      max_batch_requests: 8
      max_batch_time: 90s
      keep_alive: 60s

  frigate:
    priority: 30
    queue_limit: 20
    request_ttl: 2m
    max_wait: 2m
    overflow_policy: drop_oldest
    # Set this CIDR in secrets.env, or send X-Ollama-Client: frigate.
    source_ips:
      - "${FRIGATE_SOURCE:-}"
    # Applies to every model Frigate requests; no model registration is required.
    model_policy:
      group: frigate
      idle_hold: 3s
      max_batch_requests: 10
      max_batch_time: 60s
      keep_alive: 15s
    # Optional newest-wins coalescing. Leave disabled until the actual Frigate payload/header is known.
    deduplication:
      enabled: false
      headers: []
      json_fields: []
      # Examples, only if present and stable in your Frigate requests:
      # headers: [X-Frigate-Event-ID]
      # json_fields: [event_id, camera]

# Optional exact-model overrides can be added here, but normal models never need registration.
models: {}

scheduler:
  # Strict mode: Odysseus always goes first; live Frigate waits for its idle hold.
  # Aging, max_wait and batch limits are used only by the optional balanced mode.
  mode: strict_priority
  # Raw active + pending body budget, not a process RSS limit. Leave container headroom.
  max_queue_bytes: 67108864
  # Version 1 intentionally enforces exactly one GPU inference at a time.
  max_parallel_generations: 1
  priority_aging: false
  aging_interval: 10s
  aging_bonus: 5
  # Only Frigate needs a stable source match. Every unmatched request is Odysseus.
  default_client: odysseus
  # schedule = accept arbitrary model names using the detected client's policy.
  unknown_model_policy: schedule

circuit_breaker:
  failure_threshold: 3
  failure_window: 60s
  open_duration: 30s
  # hold preserves queued work while probes recover; reject_new returns 503 at admission.
  queue_behavior: hold

model_management:
  enabled: true
  serialize_with_inference: true

gpu_safety:
  # A proxy restart alone must not forget uncertain upstream work / GPU errors.
  state_path: /app/state/gpu-recovery.json
  # Once Ollama has accepted a request, finish reading it even if its caller disconnects.
  # This avoids aborting a ROCm model load and stranding a large GPU allocation.
  drain_active_disconnects: true
  # After the scheduler has chosen a different model, unload the prior model first.
  unload_on_model_switch: true
  unload_timeout: 30s
  # A single ROCm/GPU OOM latches the proxy into recovery_required instead of
  # dispatching more inference into a potentially poisoned driver state.
  recovery_on_oom: true
  error_body_limit_bytes: 65536

maintenance:
  # Administrative pause control is enabled by default, but every mutation requires
  # its own non-empty bearer token. Do not reuse the read-only observability token.
  enabled: true
  auth_token: "${MAINTENANCE_TOKEN:?Set MAINTENANCE_TOKEN in secrets.env}"
  # Timed pauses longer than this are rejected; manual pauses have no expiry.
  max_pause: 168h
  # Persist pause state across intermediary container restarts.
  state_path: /app/state/maintenance.json

observability:
  # The dashboard and API use the existing intermediary listener and port.
  enabled: true
  ui_enabled: true
  # Optional bearer token supplied by secrets.env. Leave blank only on a trusted LAN.
  auth_token: "${OBSERVABILITY_TOKEN:-}"
  # History is held only in memory and is erased when the container restarts.
  history_limit: 100
  recent_events: 20
  max_event_clients: 10
  queue_items_limit: 50

frigate:
  # Enable via /settings after providing the API address and host-managed credentials.
  # Old operator config.yml files need no replacement: these defaults are automatic.
  enabled: false
  url: "${FRIGATE_URL:-}"
  username: "${FRIGATE_USERNAME:-}"
  password: "${FRIGATE_PASSWORD:-}"
  auth_token: "${FRIGATE_AUTH_TOKEN:-}"
  verify_tls: true
  state_path: /app/state/frigate-backlog.json
  poll_interval: 30s
  live_grace: 2m
  retry_interval: 1m
  max_retry_interval: 1h
  request_timeout: 15s
  generation_timeout: 10m
  page_size: 100
  max_jobs: 10000
